name: Deploy to Staging

on:
  push:
    branches:
      - development

env:
  # Names come from the MainFrontend stack in fertility-grove-infrastructure.
  STACK_NAME: MainFrontend
  BUCKET: fertility-grove-main-frontend-staging
  FUNCTION_NAME: MainFrontendSsrHandler

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Install dotenv
        shell: bash
        env:
          DOTENV_DEVELOPMENT: ${{ secrets.DOTENV_DEVELOPMENT }}
        run: |
          echo "$DOTENV_DEVELOPMENT" > .env

      - name: Install dependencies
        run: yarn install

      - name: Build application
        run: yarn build

      - name: Copy runserver.sh to .next/standalone directory
        run: cp runserver.sh .next/standalone

      - name: Zip standalone directory to deploy to aws lambda
        run: cd .next/standalone && zip -r "$OLDPWD/build.zip" . && cd ../../

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-east-1

      - name: Deploy static content and build.zip to S3 bucket
        run: |
          # Cache-Control is set on upload: S3 serves objects with none, so
          # browsers re-checked every script and image on each visit. `cp
          # --recursive` rather than `sync`, because sync skips unchanged files
          # and would leave them without the header.
          # Build chunks and the video carry a version in their names: a year.
          # Images keep stable names: a day, then revalidated in the background.
          aws s3 cp ./.next/static s3://$BUCKET/_next/static --recursive --cache-control "public, max-age=31536000, immutable"
          aws s3 cp ./public/assets s3://$BUCKET/assets --recursive --exclude "video/*" --cache-control "public, max-age=86400, stale-while-revalidate=604800"
          # The video folder is optional: aws s3 cp fails on a missing path.
          if [ -d ./public/assets/video ]; then
            aws s3 cp ./public/assets/video s3://$BUCKET/assets/video --recursive --cache-control "public, max-age=31536000, immutable"
          fi
          aws s3 cp build.zip s3://$BUCKET

      - name: Deploy build.zip from S3 bucket to aws lambda
        run: aws lambda update-function-code --function-name $FUNCTION_NAME --s3-bucket $BUCKET --s3-key build.zip --no-cli-pager

      - name: Clear cloudfront cache
        run: |
          # The distribution id is read from the stack output, so a replaced
          # distribution needs no workflow change.
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "No DistributionId output on stack $STACK_NAME" >&2
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --no-cli-pager
