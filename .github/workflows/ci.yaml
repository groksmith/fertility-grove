name: CI

# Fast quality gate on every PR and on pushes to main. The prototype has no backend and no secrets,
# so every job runs against the app alone.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck + lint + unit/architecture tests.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Unit + architecture tests (Vitest)
        run: yarn test

  # Every public and member route renders with no console error, CSP violation or missing asset.
  e2e:
    # ⚠️ Pinned, not ubuntu-latest (same as pharos-web): Playwright 1.59 cannot install Chromium's
    # system dependencies on Ubuntu 26.04. Move back once a Playwright upgrade supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: yarn playwright install --with-deps chromium
      - name: Run E2E
        run: yarn test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
